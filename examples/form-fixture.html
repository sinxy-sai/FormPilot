<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>FormPilot local form fixture</title><style>body{font:16px system-ui;max-width:760px;margin:32px auto}section{border:1px solid #ddd;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:8px;margin-top:4px}button{padding:8px 14px;margin:8px 4px 0 0}.edit-panel{display:none}.edit-panel.open{display:block}.summary{background:#f5f5f5;padding:12px}</style></head>
<body><h1>FormPilot 测试简历</h1>
<section><h2>基本信息 <button type="button" data-edit="basic">编辑</button></h2><div id="basic-summary" class="summary">未填写</div><div id="basic-panel" class="edit-panel"><label>姓名<input id="full-name" name="fullName" placeholder="姓名"></label><label>邮箱<input id="email" name="email" placeholder="邮箱"></label><label>求职城市<select id="city" name="city"><option value="">请选择</option><option value="shanghai">上海</option><option value="shenzhen">深圳</option><option value="beijing">北京</option></select></label><button type="button" data-save="basic">保存</button><button type="button" data-cancel="basic">取消</button></div></section>
<section><h2>教育经历 <button type="button" data-edit="education">编辑</button></h2><div id="education-summary" class="summary">未填写</div><div id="education-panel" class="edit-panel"><label>学校<input id="school" name="school" placeholder="学校名称"></label><label>专业<select id="major" name="major"><option value="">请选择</option><option value="cs">Computer Science</option><option value="math">Mathematics</option></select></label><label>学位<select id="degree" name="degree"><option value="">请选择</option><option value="bachelor">本科</option><option value="master">硕士</option></select></label><button type="button" data-save="education">保存</button><button type="button" data-cancel="education">取消</button></div></section>
<section><h2>项目经历 <button type="button" data-edit="project">编辑</button></h2><div id="project-summary" class="summary">未填写</div><div id="project-panel" class="edit-panel"><label>项目名称<input id="project-name" name="projectName"></label><label>项目描述<textarea id="project-description" name="projectDescription"></textarea></label><button type="button" data-save="project">保存</button><button type="button" data-cancel="project">取消</button></div></section>
<script>for(const button of document.querySelectorAll('[data-edit]'))button.onclick=()=>document.querySelector(`#${button.dataset.edit}-panel`).classList.add('open');for(const button of document.querySelectorAll('[data-cancel]'))button.onclick=()=>document.querySelector(`#${button.dataset.cancel}-panel`).classList.remove('open');for(const button of document.querySelectorAll('[data-save]'))button.onclick=()=>{const key=button.dataset.save;const panel=document.querySelector(`#${key}-panel`);document.querySelector(`#${key}-summary`).textContent=[...panel.querySelectorAll('input,select,textarea')].map(el=>el.value).filter(Boolean).join(' · ')||'未填写';panel.classList.remove('open')};</script></body></html>

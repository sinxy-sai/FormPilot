<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>FormPilot local form fixture</title><style>body{font:16px system-ui;max-width:760px;margin:32px auto}section{border:1px solid #ddd;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,textarea,[role=combobox]{display:block;width:100%;box-sizing:border-box;padding:8px;margin-top:4px}button{padding:8px 14px;margin:8px 4px 0 0}.edit-panel.open{display:block}.edit-panel{display:none}.summary{background:#f5f5f5;padding:12px}.custom-options{border:1px solid #bbb;background:#fff}.custom-options[hidden]{display:none}.custom-options [role=option]{padding:8px}.custom-options [role=option]:hover{background:#eef}</style></head>
<body><h1>FormPilot 本地测试页</h1><p class="fixture-note">这是模拟招聘网站的网页表单。字段、控件和错误状态均由这个测试网页提供，不来自 FormPilot，也不代表任何真实招聘网站。</p>
<section><h2>基本信息 <button type="button" data-edit="basic">编辑</button></h2><div id="basic-summary" class="summary">未填写</div><div id="basic-panel" class="edit-panel"><label>姓名<input id="full-name" name="fullName" placeholder="姓名"></label><label>邮箱<input id="email" name="email" placeholder="邮箱"></label><label>简介<textarea id="summary" name="summary"></textarea></label><label><input id="consent" type="checkbox" name="consent"> 同意条款</label><label>求职城市<select id="city" name="city"><option value="">请选择</option><option value="shanghai">上海</option><option value="shenzhen">深圳</option><option value="beijing">北京</option></select></label><button type="button" data-save="basic">保存</button><button type="button" data-cancel="basic">取消</button></div></section>
<section><h2>教育经历 <button type="button" data-edit="education">编辑</button></h2><div id="education-summary" class="summary">未填写</div><div id="education-panel" class="edit-panel"><label>学校<input id="school" name="school" placeholder="学校名称"></label><label>专业<select id="major" name="major"><option value="">请选择</option><option value="cs">Computer Science</option><option value="math">Mathematics</option></select></label><label>学位<select id="degree" name="degree"><option value="">请选择</option><option value="bachelor">本科</option><option value="master">硕士</option></select></label><button type="button" data-save="education">保存</button><button type="button" data-cancel="education">取消</button></div></section>
<section><h2>项目经历 <button type="button" data-edit="project">编辑</button></h2><div id="project-summary" class="summary">未填写</div><div id="project-panel" class="edit-panel"><label>项目名称<input id="project-name" name="projectName"></label><label>项目描述<textarea id="project-description" name="projectDescription"></textarea></label><button type="button" data-save="project">保存</button><button type="button" data-cancel="project">取消</button></div></section>
<section><h2>自定义控件与动态区块</h2><label for="work-mode">工作模式</label><input id="work-mode" name="workMode" role="combobox" aria-label="工作模式" aria-expanded="true" autocomplete="off" value=""><div id="work-mode-options" class="custom-options" role="listbox"><div role="option" data-value="remote">远程</div><div role="option" data-value="hybrid">混合办公</div><div role="option" data-value="onsite">现场办公</div></div><div id="repeat-list"><div class="repeat-item"><label>经历条目<input name="experience[]"></label></div></div><button type="button" id="add-experience">增加经历</button><button type="button" id="change-structure">改变页面结构</button><div id="validation-error" class="formpilot-error" data-formpilot-error hidden role="alert"></div></section>
<section><h2>个人评价 <button type="button" data-edit="profile">编辑</button></h2><div id="profile-summary" class="summary">未填写</div><div id="profile-panel" class="edit-panel"><label>个人评价<textarea id="personal-evaluation" name="personalEvaluation" placeholder="个人评价"></textarea></label><button type="button" data-save="profile">保存</button><button type="button" data-cancel="profile">取消</button></div></section>
<button type="submit" id="final-submit" onclick="window.__finalSubmitClicked=true; event.preventDefault()">最终提交</button>
<script>
for(const button of document.querySelectorAll('[data-edit]'))button.onclick=()=>document.querySelector(`#${button.dataset.edit}-panel`).classList.add('open');
for(const button of document.querySelectorAll('[data-cancel]'))button.onclick=()=>document.querySelector(`#${button.dataset.cancel}-panel`).classList.remove('open');
for(const button of document.querySelectorAll('[data-save]'))button.onclick=()=>{const key=button.dataset.save;const panel=document.querySelector(`#${key}-panel`);const values=[...panel.querySelectorAll('input,select,textarea')].map(el=>el.value).filter(Boolean);const error=document.querySelector('#validation-error');if(!values.length){error.hidden=false;error.textContent='请至少填写一项';return;}error.hidden=true;document.querySelector(`#${key}-summary`).textContent=values.join(' · ');panel.classList.remove('open');};
for(const option of document.querySelectorAll('#work-mode-options [role=option]'))option.onclick=()=>{const combo=document.querySelector('#work-mode');combo.value=option.textContent.trim();combo.dataset.value=option.dataset.value;combo.setAttribute('aria-activedescendant',option.dataset.value);combo.dispatchEvent(new Event('input',{bubbles:true}));combo.dispatchEvent(new Event('change',{bubbles:true}));};
document.querySelector('#add-experience').onclick=()=>{const item=document.createElement('div');item.className='repeat-item';item.innerHTML='<label>经历条目<input name="experience[]"></label>';document.querySelector('#repeat-list').append(item);};
document.querySelector('#change-structure').onclick=()=>{const marker=document.createElement('label');marker.id='structure-change-marker';marker.textContent='新增字段';marker.innerHTML='新增字段<input name="structureChanged">';document.querySelector('#repeat-list').append(marker);};
</script></body></html>

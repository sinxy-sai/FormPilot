// 真机页面行为：点击下拉 selector 才渲染弹层；选择后更新 selectItem / chips；
// 添加/删除卡片；保存/取消只计数不提交。无外链、无网络。

(function () {
  'use strict';

  var SELECT_OPTIONS = {
    area_code: ['+86', '+852', '+1', '+44', '+81'],
    degree: ['博士', 'MBA', '硕士', '本科', '大专', '高中', '专职', '初中', '小学'],
    language: ['英语', '普通话', '日语', '韩语', '法语', '德语'],
    proficiency: ['母语', '日常会话', '精通', '熟练', '良好', '一般'],
    sns_type: ['Github', 'QQ', '微信', '领英', '个人网站'],
    preferred_city_list: ['深圳', '北京', '上海', '杭州', '广州', '成都']
  };
  var MODULE_ROOT = /^applyFormModuleWrapper(__[A-Za-z0-9]+)?$/;
  var state = { submits: 0, dropdowns: new WeakMap(), pairs: new WeakMap() };
  window.__fixtureSubmits = 0;

  function text(value) {
    if (value && value.nodeType === 1) value = value.textContent;
    return String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
  }
  function classes(element) { return String(element && element.getAttribute ? element.getAttribute('class') || '' : '').split(/\s+/).filter(Boolean); }
  function moduleOf(element) {
    for (var node = element; node; node = node.parentElement) {
      var tokens = classes(node);
      for (var index = 0; index < tokens.length; index += 1) if (MODULE_ROOT.test(tokens[index])) return node;
    }
    return null;
  }
  function fieldOf(selector) {
    var item = selector.closest('[data-form-field-name]');
    return item ? item.getAttribute('data-form-field-name') : '';
  }
  function optionsFor(field) {
    if (field === 'mobile') return SELECT_OPTIONS.area_code;
    return SELECT_OPTIONS[field] || [];
  }
  function closeSelect(selector) {
    var dropdown = state.dropdowns.get(selector);
    if (!dropdown) return;
    dropdown.style.display = 'none';
    dropdown.classList.add('ud-slide-up-leave');
  }
  function closeAll() {
    var selectors = document.querySelectorAll('.ud__select__selector');
    for (var index = 0; index < selectors.length; index += 1) closeSelect(selectors[index]);
  }
  function element(tag, className, textContent) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (textContent !== undefined) node.textContent = textContent;
    return node;
  }
  function createDropdown(selector) {
    var previous = state.dropdowns.get(selector);
    if (previous && previous.parentNode) previous.parentNode.removeChild(previous);
    var options = optionsFor(fieldOf(selector)).slice(0, 10);
    var dropdown = element('div', 'ud__select__dropdown ud__select__dropdown-placement-bottomLeft');
    var list = element('div', 'ud__select__list');
    var menu = element('div', 'ud__select__list__menu');
    var virtual = element('div', 'rc-virtual-list');
    var holder = element('div', 'rc-virtual-list-holder');
    holder.setAttribute('style', 'max-height:240px; overflow-y:hidden');
    var height = element('div');
    height.setAttribute('style', 'height:' + options.length * 32 + 'px');
    var inner = element('div', 'rc-virtual-list-holder-inner');
    inner.setAttribute('style', 'transform: translateY(0px)');
    for (var index = 0; index < options.length; index += 1) {
      var wrap = element('div');
      var item = element('div', 'ud__select__list__item');
      var content = element('div', 'ud__select__list__item__content ud__textOverflow');
      var outerSpan = element('span');
      outerSpan.appendChild(element('span', '', options[index]));
      content.appendChild(outerSpan);
      item.appendChild(content);
      item.appendChild(element('div', 'ud__select__list__item__check'));
      wrap.appendChild(item);
      inner.appendChild(wrap);
    }
    height.appendChild(inner);
    holder.appendChild(height);
    virtual.appendChild(holder);
    menu.appendChild(virtual);
    list.appendChild(menu);
    dropdown.appendChild(list);
    state.pairs.set(dropdown, selector);
    var wrapper = document.querySelector('[class*="resumeEditForm-wrapper"]') || document.body;
    wrapper.appendChild(dropdown);
    state.dropdowns.set(selector, dropdown);
  }
  function toggleChip(selector, optionText) {
    var content = selector.querySelector('[class*="ud__select__selector__content"]');
    if (!content) return;
    var tags = content.querySelectorAll('.ud__select__selector__tag');
    for (var index = 0; index < tags.length; index += 1) {
      if (text(tags[index]) === optionText) { content.removeChild(tags[index]); return; }
    }
    var chip = element('span', 'ud__tag ud__select__selector__tag', optionText);
    content.insertBefore(chip, content.firstChild);
  }
  function chooseOption(selector, optionText) {
    if (fieldOf(selector) === 'preferred_city_list') toggleChip(selector, optionText);
    else {
      var selectItem = selector.querySelector('.ud__select__selector__selectItem');
      if (selectItem) { selectItem.textContent = optionText; selectItem.setAttribute('data-value', optionText); }
    }
    closeSelect(selector);
    selector.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function clearCard(card) {
    var fields = card.querySelectorAll('input, textarea');
    for (var index = 0; index < fields.length; index += 1) {
      var field = fields[index];
      if (String(field.getAttribute('type') || '').toLowerCase() === 'checkbox') field.checked = false;
      else { field.removeAttribute('value'); field.value = ''; }
    }
    var items = card.querySelectorAll('.ud__select__selector__selectItem');
    for (var itemIndex = 0; itemIndex < items.length; itemIndex += 1) items[itemIndex].textContent = '';
    var tags = card.querySelectorAll('.ud__select__selector__tag');
    for (var tagIndex = 0; tagIndex < tags.length; tagIndex += 1) tags[tagIndex].parentElement.removeChild(tags[tagIndex]);
  }
  function addCard(button) {
    var module = moduleOf(button);
    if (!module) return null;
    var titleNode = module.querySelector('[class*="applyFormModuleWrapper-title"] [class*="applyFormModuleWrapper-text"]');
    var title = text(titleNode ? titleNode.textContent : '');
    var template = CARD_TEMPLATES && CARD_TEMPLATES[title];
    if (!template) return null;
    var holder = document.createElement('div');
    holder.innerHTML = template;
    var card = holder.firstElementChild;
    if (!card) return null;
    clearCard(card);
    module.insertBefore(card, button);
    module.classList.remove('applyFormModuleWrapper-empty', 'applyFormModuleWrapper-placeholder');
    return card;
  }

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || !target.closest) return;
    var listItem = target.closest('.ud__select__list__item');
    if (listItem) {
      var dropdown = listItem.closest('[class*="ud__select__dropdown"]');
      var selector = dropdown ? state.pairs.get(dropdown) : null;
      if (selector) chooseOption(selector, text(listItem));
      return;
    }
    var selectTrigger = target.closest('.ud__select__selector');
    if (selectTrigger) {
      event.preventDefault();
      var open = state.dropdowns.get(selectTrigger);
      if (open && open.parentNode && open.style.display !== 'none') closeSelect(selectTrigger);
      else { closeAll(); createDropdown(selectTrigger); }
      return;
    }
    var addButton = target.closest('button[class*="apply-form-array-card-add"]');
    if (addButton) { addCard(addButton); return; }
    var deleteButton = target.closest('button[class*="apply-form-array-card-delete"]');
    if (deleteButton) {
      var card = deleteButton.closest('[class*="apply-form-array-card__"]');
      if (card && card.parentNode) card.parentNode.removeChild(card);
      return;
    }
    var saveButton = target.closest('button.atsx-btn-primary, button.atsx-btn-default');
    if (saveButton) {
      event.preventDefault();
      state.submits += 1;
      window.__fixtureSubmits = state.submits;
      return;
    }
    closeAll();
  });
})();

</script>

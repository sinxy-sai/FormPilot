<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="assets/formpilot-icon.svg" alt="FormPilot"><div><strong>FormPilot</strong><small data-i18n="tagline">智能简历填充助手</small></div></div>
    <div class="settings"><label><span class="sr-only" data-i18n="language">语言</span><select id="language" aria-label="Language"><option value="zh-CN">中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option></select></label><label><span class="sr-only" data-i18n="theme">主题</span><select id="theme" aria-label="Theme"><option value="system" data-i18n="themeSystem">跟随系统</option><option value="light" data-i18n="themeLight">浅色</option><option value="dark" data-i18n="themeDark">深色</option></select></label></div>
  </header>
  <main>
    <section class="hero"><div><p class="eyebrow" data-i18n="eyebrow">APPLICATION AUTOFILL</p><h1 data-i18n="title">把简历填进网页表单</h1><p class="subtitle" data-i18n="subtitle">先读取当前页面，再审核每一个匹配结果。</p></div><span class="status-dot" title="Ready"></span></section>
    <section class="card workflow"><div class="card-title"><div><span class="step">01</span><div><h2 data-i18n="resumeTitle">简历数据</h2><p data-i18n="resumeHint">支持任意语言的 JSON 字段</p></div></div><span id="resume-state" class="pill neutral" data-i18n="notLoaded">未加载</span></div><div class="resume-actions"><button id="load" class="button secondary" data-i18n="loadResume">加载 JSON</button><button id="apply-json" class="button ghost" data-i18n="applyJson">应用修改</button></div><textarea id="resume-json" class="json-editor" rows="6" spellcheck="false" placeholder="{ ... }" aria-label="Resume JSON"></textarea></section>
    <section class="card workflow"><div class="card-title"><div><span class="step">02</span><div><h2 data-i18n="pageTitle">当前网页</h2><p data-i18n="pageHint">读取网页已有字段和编辑区</p></div></div><span id="page-state" class="pill neutral" data-i18n="waiting">等待检查</span></div><button id="inspect" class="button primary full" data-i18n="inspect">检查网页表单</button></section>
    <section id="results-card" class="card results-card hidden"><div class="card-title"><div><span class="step">03</span><div><h2 data-i18n="reviewTitle">审核匹配</h2><p data-i18n="reviewHint">确认值和路径后再填充</p></div></div><span id="match-count" class="pill success">0</span></div><section id="fields" class="fields"></section><div class="result-actions"><button id="undo" class="button ghost" data-i18n="undo">撤销上次填充</button><button id="fill" class="button primary" disabled data-i18n="fill">填充审核后的字段</button></div></section>
    <p id="status" class="status-message" data-i18n="ready">准备就绪。加载简历后开始。</p>
  </main>
  <input id="file" type="file" accept="application/json,.json" hidden>
  <script src="popup.js"></script>
</body>
</html>

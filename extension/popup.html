<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FormPilot</title><style>body{font:13px system-ui;margin:14px;width:380px;color:#202124}button{margin:3px 4px 6px 0;padding:7px 10px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer}.primary{background:#1769e0;color:#fff;border-color:#1769e0}.row{border-top:1px solid #ddd;padding:8px 0}.row label{display:block;font-weight:600}.row input{box-sizing:border-box;width:100%;margin-top:4px;padding:5px}.meta{color:#666;font-size:11px}.matched{border-left:3px solid #2e7d32;padding-left:7px}.unmatched{border-left:3px solid #c62828;padding-left:7px}#status{min-height:18px}#file{display:none}</style></head><body><h1>FormPilot</h1><p>支持中文/English JSON。加载后可直接修改字段名和值。</p><input id="file" type="file" accept="application/json,.json"><button id="load">1. Load resume.json</button><button id="inspect">2. Inspect form</button><div><button id="fill" class="primary" disabled>3. Fill reviewed fields</button><button id="undo">Undo fill</button></div><label>Resume JSON（中文/English 字段均可编辑）<textarea id="resume-json" rows="8" style="width:100%;box-sizing:border-box;font:11px monospace"></textarea></label><button id="apply-json">应用 JSON 修改并重新匹配</button><p id="status">1. 加载 JSON，2. 修改并应用，3. 检查网页表单。</p><section id="fields"></section><p>字段来源：当前网页。选项来源：当前网页控件。简历值来源：你加载的 JSON。</p><script src="popup.js"></script></body></html>
